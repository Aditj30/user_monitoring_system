<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f4f4f4; }
        h2 { color: #333; }
        h3 { color: #555; margin-top: 30px; }
        table { width: 100%; border-collapse: collapse; background: white; margin-bottom: 20px; }
        th, td { padding: 10px; border: 1px solid #ddd; text-align: left; font-size: 13px; }
        th { background: #4a90d9; color: white; }
        tr:hover { background: #f0f0f0; }
        button { padding: 5px 10px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .btn-red { background: #e74c3c; color: white; }
        .btn-orange { background: #e67e22; color: white; }
        .profile-box { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .badge-suspicious { background: #e74c3c; color: white; padding: 2px 7px; border-radius: 10px; font-size: 11px; }
        .badge-ok { background: #2ecc71; color: white; padding: 2px 7px; border-radius: 10px; font-size: 11px; }
        .danger-zone { background: white; padding: 20px; border-radius: 8px; border: 2px solid #e74c3c; margin-top: 30px; }
    </style>
</head>
<body>
    <h2>User Dashboard</h2>
    <a href="/logout" style="float:right;">Logout</a>

    <div class="profile-box">
        <p id="welcome"></p>
        <p id="user-info"></p>
    </div>

    <h3>Your Login History</h3>
    <table>
        <thead>
            <tr>
                <th>Time</th>
                <th>IP Address</th>
                <th>Device</th>
                <th>Status</th>
                <th>Suspicious</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="history-body"></tbody>
    </table>

    <div class="danger-zone">
        <h3 style="color:#e74c3c; margin-top:0;">Danger Zone</h3>
        <p>Delete your account permanently. This cannot be undone.</p>
        <input type="password" id="delete-password" placeholder="Confirm your password" />
        <button class="btn-red" onclick="deleteMyAccount()">Delete My Account</button>
        <p id="delete-msg" style="color:red;"></p>
    </div>

    <script>
        async function loadMe() {
            const res = await fetch("/api/me");
            const data = await res.json();
            document.getElementById("welcome").innerHTML = `<b>Welcome, ${data.name}</b>`;
            document.getElementById("user-info").innerHTML = `Email: ${data.email} | Role: ${data.role_name} | Member since: ${data.created_at}`;
        }

        async function loadHistory() {
            const res = await fetch("/api/my-logins");
            const rows = await res.json();
            const body = document.getElementById("history-body");
            body.innerHTML = "";
            rows.forEach(row => {
                body.innerHTML += `<tr>
                    <td>${row.login_time}</td>
                    <td>${row.ip_address}</td>
                    <td>${row.device_info}</td>
                    <td>${row.login_status}</td>
                    <td>${row.suspicious_flag ? '<span class="badge-suspicious">⚠️ Yes</span>' : '<span class="badge-ok">No</span>'}</td>
                    <td><button class="btn-orange" onclick="requestDelete(${row.login_id})">Request Delete</button></td>
                </tr>`;
            });
        }

        async function requestDelete(login_id) {
            if (!confirm("Request admin to delete this login record?")) return;
            const res = await fetch("/api/request-delete-login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ login_id })
            });
            const data = await res.json();
            alert(data.message || data.error);
        }

        async function deleteMyAccount() {
            const password = document.getElementById("delete-password").value;
            if (!password) {
                document.getElementById("delete-msg").innerText = "Please enter your password";
                return;
            }
            if (!confirm("Are you absolutely sure? This will permanently delete your account!")) return;
            const res = await fetch("/api/delete-my-account", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ password })
            });
            const data = await res.json();
            if (res.ok) {
                alert("Account deleted successfully.");
                window.location.href = "/login";
            } else {
                document.getElementById("delete-msg").innerText = data.error;
            }
        }

        loadMe();
        loadHistory();
    </script>
</body>
</html>
