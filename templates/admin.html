<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f4f4f4; }
        h2 { color: #333; }
        h3 { color: #555; margin-top: 30px; }
        table { width: 100%; border-collapse: collapse; background: white; margin-bottom: 20px; }
        th, td { padding: 10px; border: 1px solid #ddd; text-align: left; font-size: 13px; }
        th { background: #4a90d9; color: white; }
        tr:hover { background: #f0f0f0; }
        button { padding: 5px 10px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .btn-red { background: #e74c3c; color: white; }
        .btn-green { background: #2ecc71; color: white; }
        .btn-blue { background: #3498db; color: white; }
        .btn-orange { background: #e67e22; color: white; }
        .stats { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
        .stat-box { background: white; padding: 15px 25px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
        .stat-box h1 { margin: 0; color: #4a90d9; }
        .stat-box p { margin: 5px 0 0; color: #777; font-size: 13px; }
        .badge-suspicious { background: #e74c3c; color: white; padding: 2px 7px; border-radius: 10px; font-size: 11px; }
        .badge-ok { background: #2ecc71; color: white; padding: 2px 7px; border-radius: 10px; font-size: 11px; }
    </style>
</head>
<body>
    <h2>Admin Dashboard</h2>
    <a href="/logout" style="float:right;">Logout</a>

    <div class="stats" id="stats"></div>

    <h3>All Users</h3>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Role</th>
                <th>Status</th>
                <th>Logins</th>
                <th>Failed</th>
                <th>Suspicious</th>
                <th>Cooldown</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="users-body"></tbody>
    </table>

    <h3>Pending Login Deletion Requests</h3>
    <table>
        <thead>
            <tr>
                <th>User</th>
                <th>Email</th>
                <th>Login Time</th>
                <th>IP</th>
                <th>Device</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="requests-body"></tbody>
    </table>

    <h3>Suspicious Logins</h3>
    <table>
        <thead>
            <tr>
                <th>User</th>
                <th>Email</th>
                <th>Time</th>
                <th>IP</th>
                <th>Device</th>
            </tr>
        </thead>
        <tbody id="suspicious-body"></tbody>
    </table>

    <h3>All Login History</h3>
    <table>
        <thead>
            <tr>
                <th>User</th>
                <th>Time</th>
                <th>IP</th>
                <th>Device</th>
                <th>Status</th>
                <th>Suspicious</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="history-body"></tbody>
    </table>

    <script>
        async function loadStats() {
            const res = await fetch("/api/admin/stats");
            const d = await res.json();
            document.getElementById("stats").innerHTML = `
                <div class="stat-box"><h1>${d.total_users}</h1><p>Total Users</p></div>
                <div class="stat-box"><h1>${d.logins_today}</h1><p>Logins Today</p></div>
                <div class="stat-box"><h1>${d.suspicious_today}</h1><p>Suspicious Today</p></div>
                <div class="stat-box"><h1>${d.failed_today}</h1><p>Failed Today</p></div>
                <div class="stat-box"><h1>${d.users_in_cooldown}</h1><p>In Cooldown</p></div>
            `;
        }

        async function loadUsers() {
            const res = await fetch("/api/admin/users");
            const rows = await res.json();
            const body = document.getElementById("users-body");
            body.innerHTML = "";
            rows.forEach(row => {
                const inCooldown = row.cooldown_until && new Date(row.cooldown_until) > new Date();
                body.innerHTML += `<tr>
                    <td>${row.name}</td>
                    <td>${row.email}</td>
                    <td>${row.role_name}</td>
                    <td>${row.account_status}</td>
                    <td>${row.total_logins}</td>
                    <td>${row.failed_logins}</td>
                    <td>${row.suspicious_logins > 0 ? '<span class="badge-suspicious">⚠️ ' + row.suspicious_logins + '</span>' : '<span class="badge-ok">Clean</span>'}</td>
                    <td>${inCooldown ? row.cooldown_until : 'None'}</td>
                    <td>
                        ${inCooldown ? `<button class="btn-green" onclick="killCooldown(${row.user_id})">Clear Cooldown</button> ` : ''}
                        <button class="btn-blue" onclick="changeRole(${row.user_id}, ${row.role_name === 'Admin' ? 2 : 1})">${row.role_name === 'Admin' ? 'Make User' : 'Make Admin'}</button>
                        <button class="btn-red" onclick="deleteUser(${row.user_id}, '${row.name}')">Delete</button>
                    </td>
                </tr>`;
            });
        }

        async function loadRequests() {
            const res = await fetch("/api/admin/deletion-requests");
            const rows = await res.json();
            const body = document.getElementById("requests-body");
            body.innerHTML = "";
            if (rows.length === 0) {
                body.innerHTML = "<tr><td colspan='6' style='text-align:center;color:#999;'>No pending requests</td></tr>";
                return;
            }
            rows.forEach(row => {
                body.innerHTML += `<tr>
                    <td>${row.user_name}</td>
                    <td>${row.email}</td>
                    <td>${row.login_time}</td>
                    <td>${row.ip_address}</td>
                    <td>${row.device_info}</td>
                    <td>
                        <button class="btn-green" onclick="approveRequest(${row.request_id}, 'approve')">Approve</button>
                        <button class="btn-red" onclick="approveRequest(${row.request_id}, 'reject')">Reject</button>
                    </td>
                </tr>`;
            });
        }

        async function loadSuspicious() {
            const res = await fetch("/api/admin/suspicious");
            const rows = await res.json();
            const body = document.getElementById("suspicious-body");
            body.innerHTML = "";
            if (rows.length === 0) {
                body.innerHTML = "<tr><td colspan='5' style='text-align:center;color:#999;'>No suspicious logins</td></tr>";
                return;
            }
            rows.forEach(row => {
                body.innerHTML += `<tr>
                    <td>${row.user_name}</td>
                    <td>${row.email}</td>
                    <td>${row.login_time}</td>
                    <td>${row.ip_address}</td>
                    <td>${row.device_info}</td>
                </tr>`;
            });
        }

        async function loadHistory() {
            const res = await fetch("/api/admin/login-history");
            const rows = await res.json();
            const body = document.getElementById("history-body");
            body.innerHTML = "";
            rows.forEach(row => {
                body.innerHTML += `<tr>
                    <td>${row.user_name}</td>
                    <td>${row.login_time}</td>
                    <td>${row.ip_address}</td>
                    <td>${row.device_info}</td>
                    <td>${row.login_status}</td>
                    <td>${row.suspicious_flag ? '<span class="badge-suspicious">⚠️ Yes</span>' : '<span class="badge-ok">No</span>'}</td>
                    <td><button class="btn-red" onclick="deleteLogin(${row.login_id})">Delete</button></td>
                </tr>`;
            });
        }

        async function killCooldown(user_id) {
            if (!confirm("Clear cooldown for this user?")) return;
            const res = await fetch("/api/admin/kill-cooldown", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ user_id })
            });
            const data = await res.json();
            alert(data.message || data.error);
            loadUsers();
            loadStats();
        }

        async function deleteUser(user_id, name) {
            if (!confirm(`Delete user "${name}"? This cannot be undone.`)) return;
            const res = await fetch("/api/admin/delete-user", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ user_id })
            });
            const data = await res.json();
            alert(data.message || data.error);
            loadUsers();
            loadStats();
        }

        async function changeRole(user_id, new_role_id) {
            const label = new_role_id === 1 ? "Admin" : "User";
            if (!confirm(`Change this user's role to ${label}?`)) return;
            const res = await fetch("/api/admin/change-role", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ user_id, role_id: new_role_id })
            });
            const data = await res.json();
            alert(data.message || data.error);
            loadUsers();
        }

        async function deleteLogin(login_id) {
            if (!confirm("Delete this login record?")) return;
            const res = await fetch("/api/admin/delete-login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ login_id })
            });
            const data = await res.json();
            alert(data.message || data.error);
            loadHistory();
        }

        async function approveRequest(request_id, action) {
            const res = await fetch("/api/admin/approve-delete-login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ request_id, action })
            });
            const data = await res.json();
            alert(data.message || data.error);
            loadRequests();
            loadHistory();
        }

        loadStats();
        loadUsers();
        loadRequests();
        loadSuspicious();
        loadHistory();
    </script>
</body>
</html>
