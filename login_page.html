<!-- TopNavBar: Authority Source JSON -->
<nav class="w-full sticky top-0 z-50 bg-slate-50/80 dark:bg-slate-900/80 backdrop-blur-xl">
<div class="flex justify-between items-center px-6 py-4 max-w-full mx-auto">

<a class="text-blue-600 dark:text-blue-400 font-semibold border-b-2 border-blue-600" href="#">Login</a>
</div>
<div class="flex items-center gap-4">
<button class="bg-primary hover:scale-[1.02] active:scale-95 transition-all text-white px-6 py-2 rounded-full font-semibold shadow-lg shadow-primary/20">
                    Register
                </button>
</div>
</div>
<div class="bg-slate-200/50 dark:bg-slate-800/50 h-[1px] w-full"></div>
</nav>
<!-- Main Content: Login Journey -->
<main class="flex items-center justify-center min-h-[calc(100vh-80px)] px-4 py-12 relative overflow-hidden">
<!-- Decorative Elements -->
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-primary/5 blur-[120px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] rounded-full bg-secondary/5 blur-[120px]"></div>
<div class="w-full max-w-md relative z-10">
<!-- Alert Message: OTP sent to your email -->
<div class="mb-6 animate-fade-in">
<div class="bg-primary-container/30 border-l-4 border-primary p-4 rounded-lg flex items-center gap-3">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">mark_email_read</span>
<p class="text-sm font-medium text-on-primary-container font-body">OTP sent to your email. Please check your inbox.</p>
</div>
</div>
<!-- Login Card -->
<div class="surface-container-lowest glass-panel rounded-xl shadow-2xl shadow-on-surface/5 p-8 md:p-10">
<header class="mb-10">
<h1 class="font-headline font-extrabold text-3xl text-on-surface tracking-tight mb-2">Welcome Back</h1>
<p class="text-on-surface-variant font-body">Sign in to continue to your professional identity dashboard.</p>
</header>
<form class="space-y-6">
<div class="space-y-2">
<label class="block text-xs font-bold uppercase tracking-widest text-on-surface-variant font-label ml-1" for="email">Email Address</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">alternate_email</span>
<input class="w-full pl-12 pr-4 py-4 bg-surface-container-low rounded-lg border-none focus:ring-0 focus:bg-surface-container-lowest transition-all duration-300 font-body text-on-surface placeholder:text-outline/50 border-b-2 border-transparent focus:border-primary" id="email" placeholder="alex.rivera@example.com" type="email"/>
</div>
</div>
<div class="space-y-2">
<div class="flex justify-between items-center px-1">
<label class="block text-xs font-bold uppercase tracking-widest text-on-surface-variant font-label" for="password">Password</label>
<a class="text-xs font-semibold text-primary hover:underline transition-all" href="#">Forgot?</a>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">lock</span>
<input class="w-full pl-12 pr-12 py-4 bg-surface-container-low rounded-lg border-none focus:ring-0 focus:bg-surface-container-lowest transition-all duration-300 font-body text-on-surface placeholder:text-outline/50 border-b-2 border-transparent focus:border-primary" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<div class="pt-2">
<button class="w-full py-4 px-6 bg-gradient-to-r from-primary to-primary-container text-on-primary font-headline font-bold text-lg rounded-full hover:scale-[1.02] active:scale-[0.98] transition-all duration-200 shadow-lg shadow-primary/25 flex justify-center items-center gap-2" type="submit">
                            Login
                            <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
<div class="relative py-4">
<div aria-hidden="true" class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant/20"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="px-4 bg-white/0 text-on-surface-variant font-medium">Or continue with</span>
</div>
</div>
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-2 py-3 px-4 rounded-lg bg-surface-container-low hover:bg-surface-container-high transition-colors text-on-surface font-semibold text-sm border border-outline-variant/10" type="button">
<img alt="" class="w-5 h-5" data-alt="Official Google logo with vibrant colors on a clean white circular background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAyauH7Cuv7zBfysz3cMkShF_2B6mZAT0eQ2pqeSpRWERv-lRDs7OSEPW69zlMh_nWj6v8NJ3VflMVBhZSMUadwG1sFZXsap9UWsXFvaP5ZVfj-3PyIbBO_k2uOrqVs4HqyKQkvy5Pb5vTy4lUoMHhTUgw9ofFNkj8lwI8dEnnOAYBIYzPcGd9WGlFVuQePAvlR9Y-nDhttWhFC2_M-Ryy92JMkANThDWqNH3FlmwWAWEYUur5tVsVC3Dzt8OyiC0af7_0TO1HLj6Lp"/>
                            Google
                        </button>
<button class="flex items-center justify-center gap-2 py-3 px-4 rounded-lg bg-surface-container-low hover:bg-surface-container-high transition-colors text-on-surface font-semibold text-sm border border-outline-variant/10" type="button">
<span class="material-symbols-outlined text-xl">brand_family</span>
                            SSO
                        </button>
</div>
</form>
<footer class="mt-8 text-center">
<p class="text-sm text-on-surface-variant font-body">
                        Don't have an account? 
                        <a class="text-primary font-bold hover:underline transition-all" href="#">Create account</a>
</p>
</footer>
</div>
<!-- Footer Meta -->

</div>
